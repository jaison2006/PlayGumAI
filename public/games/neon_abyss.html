<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PlayGumAI — Neon Abyss: Pulse Run</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05010b;color:#fff;font-family:Inter,Segoe UI,Arial,sans-serif}
body{user-select:none}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:rgba(8,4,18,.82);border:1px solid rgba(255,255,255,.18);box-shadow:0 14px 50px #000a,inset 0 1px #fff2;backdrop-filter:blur(9px)}
#mission{position:absolute;left:18px;top:18px;padding:14px 17px;border-radius:13px;min-width:300px}
.kicker{font-size:10px;letter-spacing:3px;color:#bdb1d0}
#title{font-size:21px;font-weight:900;letter-spacing:1px;margin-top:5px}
#objective{font-size:13px;color:#c9c0d2;margin-top:5px}
#stats{font-size:11px;color:#9b91a8;margin-top:9px}
#exit{position:absolute;right:18px;top:18px;pointer-events:auto;cursor:pointer;border:1px solid #fff;background:linear-gradient(#fff,#b8b8c0);color:#050509;font-weight:900;padding:10px 18px;border-radius:9px;box-shadow:0 5px 20px #000b}
#exit:hover{filter:brightness(1.1);transform:translateY(-1px)}
#help{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:9px 14px;border-radius:10px;color:#aaa0b5;font-size:11px;white-space:nowrap}
#bars{position:absolute;right:18px;bottom:18px;width:230px;padding:12px;border-radius:11px}
.label{font-size:9px;letter-spacing:2px;color:#aaa0b5;margin:0 0 5px}
.bar{height:7px;background:#17121f;border-radius:8px;overflow:hidden;margin-bottom:8px}
.fill{height:100%;width:100%}
#hp{background:linear-gradient(90deg,#ff4fc3,#ff9bde)}
#energy{background:linear-gradient(90deg,#7dfcff,#b68cff)}
#message{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000c;pointer-events:auto}
#modal{width:min(530px,calc(100vw - 34px));padding:36px;border-radius:18px;text-align:center}
#modal h1{margin:0 0 10px;font-size:37px;letter-spacing:3px}
#modal p{margin:0;color:#b5adbd;line-height:1.55}
.btn{margin-top:20px;padding:11px 19px;border-radius:9px;font-weight:800;cursor:pointer}
#restart{background:#12101a;color:#fff;border:1px solid #666}
#modalExit{margin-left:8px;background:linear-gradient(#fff,#b8b8c0);color:#050509;border:1px solid #fff}
@media(max-width:650px){
#mission{left:10px;top:10px;width:calc(100% - 20px);min-width:0}
#exit{top:110px;right:10px}
#help{max-width:92vw;white-space:normal;text-align:center;bottom:105px}
#bars{left:50%;right:auto;transform:translateX(-50%);bottom:14px;width:min(300px,82vw)}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
<div id="mission" class="panel">
  <div class="kicker">PLAYGUMAI // NEON ABYSS</div>
  <div id="title">PULSE RUN</div>
  <div id="objective">Climb the neon ruins and collect 8 star shards.</div>
  <div id="stats">Shards: <span id="shards">0/8</span> · Combo: <span id="combo">x1</span> · Score: <span id="score">0</span></div>
</div>

<button id="exit">EXIT GAME</button>

<div id="help" class="panel">
  A/D or ←/→: MOVE · W/↑/SPACE: JUMP · MOUSE: AIM · CLICK: PULSE SHOT
</div>

<div id="bars" class="panel">
  <div class="label">VITALITY</div>
  <div class="bar"><div id="hp" class="fill"></div></div>
  <div class="label">PULSE ENERGY</div>
  <div class="bar"><div id="energy" class="fill"></div></div>
</div>

<div id="message">
 <div id="modal" class="panel">
  <h1 id="msgTitle">ABYSS CLEARED</h1>
  <p id="msgText"></p>
  <button id="restart" class="btn">RESTART</button>
  <button id="modalExit" class="btn">EXIT GAME</button>
 </div>
</div>
</div>

<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,dpr=1;
function resize(){
 W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=W*dpr;canvas.height=H*dpr;
 canvas.style.width=W+"px";canvas.style.height=H+"px";
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);resize();

const keys={};
addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(["arrowleft","arrowright","arrowup","arrowdown"," "].includes(e.key.toLowerCase()))e.preventDefault();
 if(e.key.toLowerCase()==="escape")exitGame();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

const mouse={x:W/2,y:H/2,down:false};
addEventListener("mousemove",e=>{mouse.x=e.clientX;mouse.y=e.clientY});
addEventListener("mousedown",()=>mouse.down=true);
addEventListener("mouseup",()=>mouse.down=false);

let player,platforms,shards,enemies,shots,particles,score,combo,won,lost,last,shotClock;

function reset(){
 player={x:W*.15,y:H*.65,w:25,h:35,vx:0,vy:0,hp:100,energy:100,onGround:false,inv:0};
 platforms=[
  {x:0,y:H-45,w:W,h:45},
  {x:W*.05,y:H*.72,w:W*.25,h:16},
  {x:W*.38,y:H*.58,w:W*.22,h:16},
  {x:W*.67,y:H*.70,w:W*.24,h:16},
  {x:W*.18,y:H*.40,w:W*.23,h:16},
  {x:W*.52,y:H*.27,w:W*.25,h:16},
  {x:W*.76,y:H*.45,w:W*.18,h:16}
 ];
 shards=[];
 const spots=[
  [.16,.64],[.48,.50],[.76,.62],[.29,.34],
  [.63,.21],[.85,.39],[.10,.67],[.92,.67]
 ];
 spots.forEach((p,i)=>shards.push({x:W*p[0],y:H*p[1],r:10,taken:false,p:i}));
 enemies=[
  {x:W*.46,y:H*.48,r:17,vx:55,vy:0,hp:2,ground:true},
  {x:W*.72,y:H*.61,r:17,vx:-45,vy:0,hp:2,ground:true},
  {x:W*.61,y:H*.20,r:15,vx:50,vy:0,hp:1,ground:true},
  {x:W*.86,y:H*.38,r:17,vx:-55,vy:0,hp:2,ground:true}
 ];
 shots=[];particles=[];score=0;combo=1;won=false;lost=false;shotClock=0;
 document.getElementById("message").style.display="none";
 updateHUD();
}

function burst(x,y,n=12){
 for(let i=0;i<n;i++){
  const a=Math.random()*Math.PI*2,s=35+Math.random()*170;
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.3+Math.random()*.7});
 }
}

function rectHit(a,b){
 return a.x<a.w+b.x && a.x+a.w>b.x && a.y<a.h+b.y && a.y+a.h>b.y;
}

function shoot(){
 const now=performance.now();
 if(now-shotClock<180||player.energy<8||won||lost)return;
 shotClock=now;player.energy-=8;
 const a=Math.atan2(mouse.y-(player.y+player.h/2),mouse.x-(player.x+player.w/2));
 shots.push({
  x:player.x+player.w/2,y:player.y+player.h/2,
  vx:Math.cos(a)*650,vy:Math.sin(a)*650,life:.8
 });
 burst(player.x+player.w/2,player.y+player.h/2,3);
}

function jump(){
 if(player.onGround){
  player.vy=-520;
  player.onGround=false;
 }
}

function update(dt){
 if(won||lost)return;

 let dir=0;
 if(keys.a||keys.arrowleft)dir--;
 if(keys.d||keys.arrowright)dir++;
 player.vx=dir*245;
 player.vy+=1250*dt;
 player.x+=player.vx*dt;
 player.y+=player.vy*dt;

 if((keys.w||keys.arrowup||keys[" "])&&player.onGround){
  jump();
  keys.w=false;keys.arrowup=false;keys[" "]=false;
 }

 player.x=Math.max(0,Math.min(W-player.w,player.x));

 player.onGround=false;
 platforms.forEach(p=>{
  if(player.x+player.w>p.x&&player.x<p.x+p.w&&
     player.y+player.h>=p.y&&player.y+player.h<=p.y+22&&player.vy>=0){
    player.y=p.y-player.h;player.vy=0;player.onGround=true;
  }
 });

 if(mouse.down){shoot();mouse.down=false}

 player.energy=Math.min(100,player.energy+9*dt);
 player.inv=Math.max(0,player.inv-dt);

 shards.forEach(s=>{
  if(!s.taken&&Math.hypot(player.x+player.w/2-s.x,player.y+player.h/2-s.y)<30){
   s.taken=true;
   score+=150*combo;
   combo=Math.min(9,combo+1);
   player.energy=Math.min(100,player.energy+15);
   burst(s.x,s.y,24);
  }
 });

 enemies.forEach(e=>{
  e.x+=e.vx*dt;
  if(e.x<30||e.x>W-45)e.vx*=-1;
  e.y+=e.vy*dt;
  e.vy+=900*dt;
  e.ground=false;
  platforms.forEach(p=>{
   if(e.x+e.r>p.x&&e.x-e.r<p.x+p.w&&e.y+e.r>=p.y&&e.y+e.r<=p.y+20&&e.vy>=0){
    e.y=p.y-e.r;e.vy=0;e.ground=true;
   }
  });
  const d=Math.hypot(player.x+player.w/2-e.x,player.y+player.h/2-e.y);
  if(d<34&&!player.inv){
   player.hp-=30*dt;combo=1;player.inv=.12;
  }
 });

 shots.forEach(s=>{
  s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
  enemies.forEach(e=>{
   if(e.hp<=0||s.life<=0)return;
   if(Math.hypot(s.x-e.x,s.y-e.y)<e.r+7){
    s.life=0;e.hp--;burst(e.x,e.y,7);
    if(e.hp<=0){
     score+=250*combo;combo=Math.min(9,combo+1);burst(e.x,e.y,22);
    }
   }
  });
 });
 shots=shots.filter(s=>s.life>0);
 enemies=enemies.filter(e=>e.hp>0);

 if(shards.every(s=>s.taken)){
  document.getElementById("objective").textContent="All shards collected. Reach the portal above.";
  const portal={x:W*.93,y:H*.31};
  if(Math.hypot(player.x+player.w/2-portal.x,player.y+player.h/2-portal.y)<60){
   won=true;score+=1200;showResult(true);
  }
 }

 if(player.y>H+100||player.hp<=0){
  lost=true;showResult(false);
 }

 particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});
 particles=particles.filter(p=>p.life>0);
 updateHUD();
}

function updateHUD(){
 const n=shards.filter(s=>s.taken).length;
 document.getElementById("shards").textContent=n+"/8";
 document.getElementById("combo").textContent="x"+combo;
 document.getElementById("score").textContent=score;
 document.getElementById("hp").style.width=Math.max(0,player.hp)+"%";
 document.getElementById("energy").style.width=Math.max(0,player.energy)+"%";
}

function showResult(success){
 document.getElementById("msgTitle").textContent=success?"ABYSS CLEARED":"SIGNAL LOST";
 document.getElementById("msgText").textContent=success
 ?"The pulse core has opened the escape portal. Final score: "+score+"."
 :"You fell into the abyss or lost all vitality. Final score: "+score+".";
 document.getElementById("message").style.display="flex";
}

function draw(){
 ctx.clearRect(0,0,W,H);

 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#090014");g.addColorStop(.55,"#17052a");g.addColorStop(1,"#030006");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 // neon background stars
 for(let i=0;i<90;i++){
  const x=(i*137)%W,y=(i*83)%H;
  ctx.fillStyle=i%3===0?"rgba(255,120,230,.55)":"rgba(120,220,255,.4)";
  ctx.fillRect(x,y,1.5,1.5);
 }

 // giant rings
 ctx.strokeStyle="rgba(255,80,220,.08)";ctx.lineWidth=2;
 for(let r=90;r<Math.max(W,H);r+=100){
  ctx.beginPath();ctx.arc(W*.5,H*.5,r,0,Math.PI*2);ctx.stroke();
 }

 // platforms
 platforms.forEach(p=>{
  ctx.fillStyle="#0e0b16";ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.strokeStyle="#d95cff";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+p.w,p.y);ctx.stroke();
  ctx.strokeStyle="rgba(85,240,255,.35)";
  ctx.beginPath();ctx.moveTo(p.x,p.y+p.h);ctx.lineTo(p.x+p.w,p.y+p.h);ctx.stroke();
 });

 // portal
 const portalReady=shards.every(s=>s.taken);
 const px=W*.93,py=H*.31;
 ctx.shadowBlur=25;ctx.shadowColor=portalReady?"#fff":"#7c42a0";
 ctx.strokeStyle=portalReady?"#fff":"#693a82";ctx.lineWidth=4;
 ctx.beginPath();ctx.arc(px,py,32+Math.sin(performance.now()/200)*3,0,Math.PI*2);ctx.stroke();
 ctx.shadowBlur=0;
 ctx.fillStyle="#cfa9ff";ctx.font="10px Arial";ctx.textAlign="center";
 ctx.fillText(portalReady?"ESCAPE":"LOCKED",px,py+52);ctx.textAlign="left";

 // shards
 shards.forEach(s=>{
  if(s.taken)return;
  const pulse=3+Math.sin(performance.now()/180+s.p)*3;
  ctx.save();ctx.translate(s.x,s.y);ctx.rotate(performance.now()/1000+s.p);
  ctx.shadowBlur=20;ctx.shadowColor="#6ffcff";
  ctx.fillStyle="#8dfcff";
  ctx.beginPath();ctx.moveTo(0,-s.r-pulse);ctx.lineTo(s.r,0);ctx.lineTo(0,s.r+pulse);ctx.lineTo(-s.r,0);ctx.closePath();ctx.fill();
  ctx.restore();ctx.shadowBlur=0;
 });

 // enemies
 enemies.forEach(e=>{
  ctx.save();ctx.translate(e.x,e.y);
  ctx.shadowBlur=18;ctx.shadowColor="#ff4fc3";
  ctx.fillStyle="#170c1d";ctx.strokeStyle="#ff72d1";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,-e.r);ctx.lineTo(e.r,e.r);ctx.lineTo(-e.r,e.r);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.shadowBlur=0;
  ctx.fillStyle="#fff";ctx.fillRect(-4,-1,8,5);
  ctx.restore();
 });

 // particles
 particles.forEach(p=>{
  ctx.globalAlpha=Math.max(0,p.life);
  ctx.fillStyle=p.life>.5?"#72faff":"#ff65cf";
  ctx.fillRect(p.x,p.y,3,3);
 });
 ctx.globalAlpha=1;

 // shots
 shots.forEach(s=>{
  ctx.shadowBlur=16;ctx.shadowColor="#7dfcff";
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(s.x,s.y,4,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
 });

 // player
 ctx.save();ctx.translate(player.x+player.w/2,player.y+player.h/2);
 ctx.globalAlpha=player.inv>0?.45:1;
 ctx.shadowBlur=25;ctx.shadowColor="#ff5bd7";
 ctx.fillStyle="#f5f5ff";
 ctx.beginPath();ctx.arc(0,0,15,0,Math.PI*2);ctx.fill();
 ctx.shadowBlur=0;
 ctx.fillStyle="#171020";ctx.fillRect(-7,-7,14,14);
 ctx.strokeStyle="#78faff";ctx.lineWidth=3;
 ctx.beginPath();ctx.arc(0,0,20,0,Math.PI*2);ctx.stroke();
 ctx.restore();
 ctx.globalAlpha=1;

 // aim crosshair
 ctx.strokeStyle="rgba(255,255,255,.8)";
 ctx.beginPath();ctx.arc(mouse.x,mouse.y,9,0,Math.PI*2);ctx.stroke();
 ctx.beginPath();ctx.moveTo(mouse.x-14,mouse.y);ctx.lineTo(mouse.x-5,mouse.y);
 ctx.moveTo(mouse.x+5,mouse.y);ctx.lineTo(mouse.x+14,mouse.y);ctx.stroke();
}

function loop(t){
 const dt=Math.min(.033,(t-last)/1000);last=t;
 update(dt);draw();requestAnimationFrame(loop);
}

function exitGame(){
 if(history.length>1)history.back();
 else location.href="/";
}
document.getElementById("exit").onclick=exitGame;
document.getElementById("modalExit").onclick=exitGame;
document.getElementById("restart").onclick=reset;

reset();last=performance.now();requestAnimationFrame(loop);
</script>
</body>
</html>
