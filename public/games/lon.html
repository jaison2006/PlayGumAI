<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PlayGumAI — Echo Station</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020306;color:#eef3f7;font-family:Inter,Segoe UI,Arial,sans-serif}
body{user-select:none}
#game{display:block;width:100vw;height:100vh;background:#020306}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:rgba(5,8,12,.76);border:1px solid rgba(210,220,230,.25);box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.08);backdrop-filter:blur(10px)}
#status{position:absolute;left:22px;top:20px;padding:12px 16px;border-radius:12px;min-width:220px}
#status b{display:block;font-size:12px;letter-spacing:2px;color:#aeb9c4;margin-bottom:5px}
#objective{font-size:14px}
#exit{position:absolute;right:20px;top:18px;pointer-events:auto;border:1px solid #dce3e8;background:linear-gradient(180deg,#f7f9fa,#aeb8c0);color:#050607;font-weight:800;padding:10px 18px;border-radius:10px;cursor:pointer;box-shadow:0 4px 18px #0008}
#exit:hover{filter:brightness(1.12);transform:translateY(-1px)}
#help{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:10px 15px;border-radius:10px;color:#bfc8d0;font-size:12px;letter-spacing:.5px}
#message{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    padding:28px 34px;
    border-radius:18px;
    min-width:320px;
    display:none;
    pointer-events:auto;
}
#message h1{margin:0 0 8px;font-size:30px;letter-spacing:1px}
#message p{margin:7px 0;color:#b8c2ca;line-height:1.5}
#message button{margin-top:14px;border:0;border-radius:10px;padding:11px 20px;font-weight:800;background:linear-gradient(180deg,#fff,#aeb7be);cursor:pointer}
#crosshair{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);opacity:.7}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#e9f0f5}
#crosshair:before{width:18px;height:1px;top:9px;left:0}#crosshair:after{height:18px;width:1px;left:9px;top:0}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="status" class="panel"><b>MISSION // ECHO STATION</b><span id="objective">Restore the station beacon</span></div>
  <button id="exit">EXIT GAME</button>
  <div id="crosshair"></div>
  <div id="help" class="panel">WASD / Arrow Keys: move &nbsp; • &nbsp; Mouse: aim &nbsp; • &nbsp; Click: pulse tool &nbsp; • &nbsp; Collect 3 energy nodes</div>
  <div id="message" class="panel">
    <h1 id="msgTitle"></h1><p id="msgText"></p><button id="msgExit">EXIT GAME</button>
  </div>
</div>

<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const exitBtn=document.getElementById("exit"),msg=document.getElementById("message"),msgTitle=document.getElementById("msgTitle"),msgText=document.getElementById("msgText"),msgExit=document.getElementById("msgExit");
let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0)} addEventListener("resize",resize);resize();

const keys={}; addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase()))e.preventDefault()});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
let mouse={x:W/2,y:H/2,down:false}; addEventListener("mousemove",e=>{mouse.x=e.clientX;mouse.y=e.clientY}); addEventListener("mousedown",()=>mouse.down=true); addEventListener("mouseup",()=>mouse.down=false);

const world={w:2600,h:1700};
const player={x:1300,y:850,r:18,vx:0,vy:0,angle:0,energy:100};
const beacon={x:2200,y:430,r:42,active:false};
const nodes=[
 {x:700,y:380,r:22,taken:false},
 {x:1850,y:1120,r:22,taken:false},
 {x:1050,y:1320,r:22,taken:false}
];
const drones=[
 {x:450,y:1050,r:24,a:0,hit:0},
 {x:1600,y:420,r:24,a:2,hit:0},
 {x:2150,y:1250,r:24,a:4,hit:0}
];
let shots=[],particles=[],cam={x:0,y:0},last=performance.now(),ended=false;

function reset(){player.x=1300;player.y=850;nodes.forEach(n=>n.taken=false);beacon.active=false;shots=[];particles=[];ended=false;msg.style.display="none";document.getElementById("objective").textContent="Restore the station beacon";requestAnimationFrame(loop)}
function exitGame(){
    window.history.back();
}
exitBtn.onclick=exitGame;msgExit.onclick=exitGame;

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function spark(x,y,count=8){for(let i=0;i<count;i++){let a=Math.random()*Math.PI*2,s=30+Math.random()*100;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5+Math.random()*.7})}}

function update(dt){
 if(ended)return;
 let ax=0,ay=0;
 if(keys.w||keys.arrowup)ay--;if(keys.s||keys.arrowdown)ay++;if(keys.a||keys.arrowleft)ax--;if(keys.d||keys.arrowright)ax++;
 const len=Math.hypot(ax,ay)||1;ax/=len;ay/=len;
 const accel=720,friction=Math.pow(.001,dt),max=300;
 player.vx+=ax*accel*dt;player.vy+=ay*accel*dt;
 const sp=Math.hypot(player.vx,player.vy);if(sp>max){player.vx=player.vx/sp*max;player.vy=player.vy/sp*max}
 player.vx*=friction;player.vy*=friction;
 player.x=Math.max(60,Math.min(world.w-60,player.x+player.vx*dt));player.y=Math.max(60,Math.min(world.h-60,player.y+player.vy*dt));
 player.angle=Math.atan2(mouse.y-H/2,mouse.x-W/2);
 nodes.forEach(n=>{if(!n.taken&&dist(player,n)<42){n.taken=true;spark(n.x,n.y,18)}});
 if(nodes.every(n=>n.taken)&&!beacon.active){beacon.active=true;document.getElementById("objective").textContent="Beacon unlocked — reach the extraction beacon"} 
 if(beacon.active&&dist(player,beacon)<70){finish()}
 drones.forEach(d=>{
   d.a+=dt;
   const dx=player.x-d.x,dy=player.y-d.y,dd=Math.hypot(dx,dy)||1;
   if(dd<650){d.x+=dx/dd*42*dt;d.y+=dy/dd*42*dt}
   if(dist(player,d)<42){player.energy-=16*dt;spark(player.x,player.y,1);if(player.energy<=0)finish(false)}
 });
 if(mouse.down&&shots.length<4){shoot();mouse.down=false}
 shots.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;drones.forEach(d=>{if(s.life>0&&dist(s,d)<d.r+7){d.hit=1;d.x+=s.vx*.03;d.y+=s.vy*.03;s.life=0;spark(d.x,d.y,12)}})});shots=shots.filter(s=>s.life>0);
 particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);
 cam.x+=(player.x-W/2-cam.x)*Math.min(1,dt*5);cam.y+=(player.y-H/2-cam.y)*Math.min(1,dt*5);
}
function shoot(){let a=player.angle;shots.push({x:player.x+Math.cos(a)*25,y:player.y+Math.sin(a)*25,vx:Math.cos(a)*720,vy:Math.sin(a)*720,life:.8});spark(player.x+Math.cos(a)*25,player.y+Math.sin(a)*25,3)}
function finish(win=true){ended=true;msgTitle.textContent=win?"MISSION COMPLETE":"SYSTEM FAILURE";msgText.textContent=win?"The beacon is restored and the station is ready for extraction.":"Your suit energy reached zero. Restart the mission and try again.";msg.style.display="block"}

function draw(){
 ctx.clearRect(0,0,W,H);
 const g=ctx.createRadialGradient(W*.5,H*.5,80,W*.5,H*.5,Math.max(W,H));g.addColorStop(0,"#10161d");g.addColorStop(1,"#010204");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.save();ctx.translate(-cam.x,-cam.y);
 // starfield
 for(let i=0;i<150;i++){let x=(i*173)%world.w,y=(i*97)%world.h;ctx.fillStyle=`rgba(210,225,235,${.15+(i%5)/20})`;ctx.fillRect(x,y,1.5,1.5)}
 // station floor
 ctx.strokeStyle="rgba(180,195,205,.12)";ctx.lineWidth=1;
 for(let x=0;x<world.w;x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world.h);ctx.stroke()}
 for(let y=0;y<world.h;y+=100){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world.w,y);ctx.stroke()}
 // structures
 [[350,250,520,220],[1500,180,620,180],[1800,900,500,300],[300,900,380,420]].forEach(r=>{ctx.fillStyle="rgba(20,28,35,.85)";ctx.fillRect(...r);ctx.strokeStyle="rgba(200,210,220,.18)";ctx.strokeRect(...r)});
 // beacon
 ctx.beginPath();ctx.arc(beacon.x,beacon.y,beacon.r+12,0,Math.PI*2);ctx.fillStyle=beacon.active?"rgba(220,230,235,.12)":"rgba(100,110,120,.08)";ctx.fill();
 ctx.beginPath();ctx.arc(beacon.x,beacon.y,beacon.r,0,Math.PI*2);ctx.strokeStyle=beacon.active?"#e8edf1":"#4d5963";ctx.lineWidth=4;ctx.stroke();
 ctx.fillStyle=beacon.active?"#fff":"#55616b";ctx.fillText("EXTRACTION",beacon.x-35,beacon.y+70);
 // nodes
 nodes.forEach(n=>{if(n.taken)return;ctx.beginPath();ctx.arc(n.x,n.y,n.r+7,0,Math.PI*2);ctx.fillStyle="rgba(225,235,240,.08)";ctx.fill();ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);ctx.fillStyle="#dfe6eb";ctx.fill();ctx.fillStyle="#59636b";ctx.fillRect(n.x-4,n.y-10,8,20)});
 // drones
 drones.forEach(d=>{ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.a);ctx.fillStyle="#313b44";ctx.strokeStyle="#d4dce1";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,d.r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle="#eef3f6";ctx.fillRect(-6,-4,12,8);ctx.restore()});
 // shots
 shots.forEach(s=>{ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(s.x,s.y,4,0,Math.PI*2);ctx.fill()});
 // player
 ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.angle);ctx.fillStyle="#dfe5e9";ctx.strokeStyle="#ffffff";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,player.r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle="#161b20";ctx.beginPath();ctx.arc(6,0,10,0,Math.PI*2);ctx.fill();ctx.restore();
 particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle="#e9eff2";ctx.fillRect(p.x,p.y,3,3);ctx.globalAlpha=1});
 ctx.restore();
 // energy
 ctx.fillStyle="rgba(255,255,255,.15)";ctx.fillRect(22,86,180,7);ctx.fillStyle="#e8edf1";ctx.fillRect(22,86,180*Math.max(0,player.energy/100),7);
 ctx.fillStyle="#aeb8c0";ctx.font="11px Segoe UI";ctx.fillText("SUIT ENERGY",22,78);
}
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();if(!ended)requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
