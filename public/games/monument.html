<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PlayGumAI — Monument of Echoes</title>
<style>
:root{
  --bg:#050505;
  --panel:rgba(9,9,10,.88);
  --line:rgba(255,255,255,.18);
  --text:#f4f4f4;
  --muted:#969696;
  --silver:#e9e9e9;
  --dark:#252525;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
body{touch-action:none}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{
  background:var(--panel);
  border:1px solid var(--line);
  box-shadow:0 18px 50px #000b,inset 0 1px #fff1;
  backdrop-filter:blur(12px);
}
#top{
  position:absolute;left:18px;top:18px;
  width:min(330px,calc(100vw - 36px));
  padding:14px 16px;border-radius:14px;
}
.eyebrow{font-size:10px;letter-spacing:2.5px;color:#999}
#title{font-size:18px;font-weight:800;margin-top:5px}
#objective{font-size:13px;color:#c7c7c7;margin-top:5px;line-height:1.4}
#progress{font-size:11px;color:#888;margin-top:8px}
#exit{
  position:absolute;right:18px;top:18px;
  pointer-events:auto;cursor:pointer;
  border:1px solid #fff;border-radius:10px;
  padding:10px 17px;font-weight:900;color:#050505;
  background:linear-gradient(#fff,#b8b8b8);
  box-shadow:0 6px 20px #0009;
}
#exit:hover{filter:brightness(1.08);transform:translateY(-1px)}
#controls{
  position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
  width:max-content;max-width:calc(100vw - 36px);
  padding:9px 13px;border-radius:10px;
  color:#aaa;font-size:11px;text-align:center;
}
#actions{
  position:absolute;right:18px;bottom:18px;
  display:flex;gap:8px;pointer-events:auto;
}
.action{
  border:1px solid #777;border-radius:9px;
  background:#101010;color:#eee;padding:9px 12px;
  cursor:pointer;font-weight:700;
}
.action:hover{background:#202020}
.action:disabled{opacity:.35;cursor:not-allowed}
#hint{
  position:absolute;left:50%;top:100px;transform:translateX(-50%);
  padding:9px 14px;border-radius:10px;color:#ddd;
  opacity:0;transition:opacity .2s;white-space:nowrap;
}
#hint.show{opacity:1}
#message{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  pointer-events:auto;background:rgba(0,0,0,.38);
}
#modal{
  width:min(480px,calc(100vw - 36px));padding:30px;border-radius:20px;text-align:center;
}
#modal h1{margin:0 0 8px;font-size:32px}
#modal p{margin:0;color:#aaa;line-height:1.55}
.modalBtns{margin-top:20px;display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
.modalBtn{
  border:1px solid #888;border-radius:10px;padding:11px 17px;
  cursor:pointer;font-weight:800;background:#121212;color:#eee;
}
.modalBtn.primary{background:linear-gradient(#fff,#aaa);color:#050505;border-color:#fff}
@media(max-width:700px){
  #top{left:12px;top:12px;width:calc(100vw - 24px)}
  #exit{right:12px;top:94px}
  #controls{bottom:12px;font-size:10px}
  #actions{left:12px;right:auto;bottom:52px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="top" class="panel">
    <div class="eyebrow">MONUMENT // ECHO CHAMBER</div>
    <div id="title">The Silent Stair</div>
    <div id="objective">Rotate the stone bridges until the path reaches the door.</div>
    <div id="progress">Chamber 1 / 3 · Moves 0</div>
  </div>

  <button id="exit">EXIT GAME</button>

  <div id="hint" class="panel">Try rotating the highlighted bridge.</div>

  <div id="actions">
    <button class="action" id="undo">UNDO</button>
    <button class="action" id="reset">RESET</button>
    <button class="action" id="hintBtn">HINT</button>
  </div>

  <div id="controls" class="panel">
    Click / tap a glowing bridge to rotate it · R = rotate · U = undo · Esc = exit
  </div>

  <div id="message">
    <div id="modal" class="panel">
      <h1 id="msgTitle">MONUMENT RESTORED</h1>
      <p id="msgText"></p>
      <div class="modalBtns">
        <button class="modalBtn" id="again">PLAY AGAIN</button>
        <button class="modalBtn primary" id="msgExit">EXIT GAME</button>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,dpr=1;
function resize(){
  W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);resize();

const ui={
  title:document.getElementById("title"),
  objective:document.getElementById("objective"),
  progress:document.getElementById("progress"),
  hint:document.getElementById("hint"),
  message:document.getElementById("message"),
  msgTitle:document.getElementById("msgTitle"),
  msgText:document.getElementById("msgText"),
  undo:document.getElementById("undo")
};

const levels=[
  {
    name:"The Silent Stair",
    start:[0,0],
    goal:[4,0],
    cells:[
      {x:0,y:0,rot:0,kind:"straight"},
      {x:1,y:0,rot:0,kind:"corner"},
      {x:2,y:0,rot:1,kind:"corner"},
      {x:3,y:0,rot:1,kind:"straight"},
      {x:4,y:0,rot:1,kind:"corner"},
      {x:4,y:1,rot:0,kind:"straight"},
      {x:4,y:2,rot:0,kind:"corner"},
      {x:3,y:2,rot:1,kind:"corner"},
      {x:2,y:2,rot:0,kind:"straight"},
      {x:1,y:2,rot:0,kind:"corner"},
      {x:0,y:2,rot:1,kind:"straight"},
      {x:0,y:1,rot:0,kind:"corner"}
    ],
    fixed:[[0,0],[4,2]]
  },
  {
    name:"The Broken Gallery",
    start:[0,1],
    goal:[5,0],
    cells:[
      {x:0,y:1,rot:0,kind:"corner"},
      {x:1,y:1,rot:1,kind:"corner"},
      {x:2,y:1,rot:0,kind:"straight"},
      {x:3,y:1,rot:1,kind:"corner"},
      {x:3,y:0,rot:0,kind:"corner"},
      {x:4,y:0,rot:1,kind:"straight"},
      {x:5,y:0,rot:0,kind:"corner"},
      {x:5,y:1,rot:1,kind:"corner"},
      {x:4,y:1,rot:0,kind:"straight"},
      {x:4,y:2,rot:1,kind:"corner"},
      {x:3,y:2,rot:0,kind:"straight"},
      {x:2,y:2,rot:1,kind:"corner"},
      {x:1,y:2,rot:0,kind:"corner"},
      {x:0,y:2,rot:1,kind:"straight"}
    ],
    fixed:[[0,1],[5,0]]
  },
  {
    name:"The Endless Turn",
    start:[0,0],
    goal:[5,2],
    cells:[
      {x:0,y:0,rot:0,kind:"corner"},
      {x:1,y:0,rot:0,kind:"straight"},
      {x:2,y:0,rot:1,kind:"corner"},
      {x:2,y:1,rot:0,kind:"straight"},
      {x:2,y:2,rot:1,kind:"corner"},
      {x:3,y:2,rot:0,kind:"corner"},
      {x:4,y:2,rot:1,kind:"straight"},
      {x:5,y:2,rot:0,kind:"corner"},
      {x:4,y:1,rot:1,kind:"corner"},
      {x:4,y:0,rot:0,kind:"straight"},
      {x:5,y:0,rot:1,kind:"corner"},
      {x:1,y:1,rot:1,kind:"straight"},
      {x:0,y:1,rot:0,kind:"corner"}
    ],
    fixed:[[0,0],[5,2]]
  }
];

let levelIndex=0,moves=0,history=[],player={x:0,y:0,px:0,py:0};
let solved=false,animating=false,hintTimer=null;
let particles=[],pulse=0;

function key(x,y){return x+","+y}
function levelData(){return levels[levelIndex]}
function cellAt(x,y){return levelData().cells.find(c=>c.x===x&&c.y===y)}
function isFixed(c){return levelData().fixed.some(p=>p[0]===c.x&&p[1]===c.y)}

function connections(c){
  // N,E,S,W; rot is quarter-turn clockwise
  const base=c.kind==="straight" ? [1,0,1,0] : [1,1,0,0];
  let r=((c.rot%4)+4)%4;
  const out=[0,0,0,0];
  for(let i=0;i<4;i++)out[(i+r)%4]=base[i];
  return out;
}

function reachable(){
  const L=levelData(), start=L.start;
  const q=[start],seen=new Set([key(...start)]);
  while(q.length){
    const [x,y]=q.shift(),c=cellAt(x,y);
    if(!c)continue;
    const a=connections(c);
    const dirs=[[0,-1],[1,0],[0,1],[-1,0]];
    for(let d=0;d<4;d++){
      if(!a[d])continue;
      const nx=x+dirs[d][0],ny=y+dirs[d][1],n=cellAt(nx,ny);
      if(!n)continue;
      const b=connections(n);
      if(!b[(d+2)%4])continue;
      const k=key(nx,ny);
      if(!seen.has(k)){seen.add(k);q.push([nx,ny])}
    }
  }
  return seen;
}

function isSolved(){
  const seen=reachable(),g=levelData().goal;
  return seen.has(key(g[0],g[1]));
}

function snapshot(){
  return levelData().cells.map(c=>c.rot);
}
function restore(s){
  levelData().cells.forEach((c,i)=>c.rot=s[i]);
}

function loadLevel(){
  const L=levelData();
  moves=0;history=[];solved=false;animating=false;
  player.x=L.start[0];player.y=L.start[1];
  player.px=player.x;player.py=player.y;
  ui.title.textContent=L.name;
  ui.objective.textContent="Rotate the stone bridges until the path reaches the door.";
  updateUI();
}

function updateUI(){
  ui.progress.textContent=`Chamber ${levelIndex+1} / ${levels.length} · Moves ${moves}`;
  ui.undo.disabled=history.length===0;
}

function saveAndRotate(c){
  if(animating||solved||isFixed(c))return;
  history.push(snapshot());
  c.rot=(c.rot+1)%4;
  moves++;
  updateUI();
  pulse=1;
  burst(cellScreen(c.x,c.y).x,cellScreen(c.x,c.y).y,8);
  if(isSolved())completePath();
}

function undo(){
  if(animating||!history.length)return;
  restore(history.pop());moves=Math.max(0,moves-1);
  updateUI();pulse=1;
}

function reset(){
  if(animating)return;
  loadLevel();
}

function showHint(){
  if(solved||animating)return;
  const c=levelData().cells.find(c=>!isFixed(c));
  if(!c)return;
  ui.hint.textContent=`Rotate the highlighted bridge at (${c.x+1}, ${c.y+1}).`;
  ui.hint.classList.add("show");
  setTimeout(()=>ui.hint.classList.remove("show"),2200);
  c._hintUntil=performance.now()+2200;
}

function completePath(){
  solved=true;
  ui.objective.textContent="Path connected. The traveler is crossing the monument…";
  const seen=reachable();
  const route=buildRoute();
  animatePlayer(route);
}

function buildRoute(){
  const L=levelData(),start=L.start,goal=L.goal;
  const q=[start],prev=new Map([[key(...start),null]]);
  const dirs=[[0,-1],[1,0],[0,1],[-1,0]];
  while(q.length){
    const cur=q.shift(),c=cellAt(...cur);
    if(cur[0]===goal[0]&&cur[1]===goal[1])break;
    const a=connections(c);
    for(let d=0;d<4;d++){
      if(!a[d])continue;
      const nx=cur[0]+dirs[d][0],ny=cur[1]+dirs[d][1],n=cellAt(nx,ny);
      if(!n)continue;
      if(!connections(n)[(d+2)%4])continue;
      const k=key(nx,ny);
      if(!prev.has(k)){prev.set(k,cur);q.push([nx,ny])}
    }
  }
  const route=[],g=goal;
  let cur=g;
  while(cur){route.unshift(cur);cur=prev.get(key(...cur))}
  return route;
}

function animatePlayer(route){
  if(route.length<2){finishLevel();return}
  animating=true;
  let i=0;
  function step(){
    if(i>=route.length){animating=false;finishLevel();return}
    const [tx,ty]=route[i++];
    const sx=player.px,sy=player.py,start=performance.now(),dur=300;
    function frame(t){
      const p=Math.min(1,(t-start)/dur),e=p*p*(3-2*p);
      player.px=sx+(tx-sx)*e;player.py=sy+(ty-sy)*e;
      if(p<1)requestAnimationFrame(frame);else{player.x=tx;player.y=ty;step()}
    }
    requestAnimationFrame(frame);
  }
  step();
}

function finishLevel(){
  solved=true;
  burst(cellScreen(...levelData().goal).x,cellScreen(...levelData().goal).y,35);
  if(levelIndex<levels.length-1){
    ui.objective.textContent="Chamber solved. The monument opens another path…";
    setTimeout(()=>{levelIndex++;loadLevel()},1100);
  }else{
    ui.msgTitle.textContent="MONUMENT RESTORED";
    ui.msgText.textContent=`All ${levels.length} chambers solved in ${moves} moves on the final chamber. The path is complete.`;
    ui.message.style.display="flex";
  }
}

function cellScreen(x,y){
  const L=levelData(),xs=L.cells.map(c=>c.x),ys=L.cells.map(c=>c.y);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const cw=Math.min(145,Math.max(86,(W-100)/(maxX-minX+1)));
  const ch=Math.min(115,Math.max(76,(H-210)/(maxY-minY+1)));
  const ox=(W-(maxX-minX+1)*cw)/2-cw*minX;
  const oy=H/2-(maxY-minY+1)*ch/2-ch*0.1;
  return {x:ox+x*cw+cw/2,y:oy+y*ch+ch/2,cw,ch,ox,oy};
}

function burst(x,y,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=30+Math.random()*130;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.65});
  }
}

function drawBackground(){
  const g=ctx.createRadialGradient(W*.5,H*.45,40,W*.5,H*.45,Math.max(W,H));
  g.addColorStop(0,"#202020");g.addColorStop(.55,"#0b0b0b");g.addColorStop(1,"#020202");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(255,255,255,.035)";
  for(let x=0;x<W;x+=70){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=70){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
}

function drawArchitecture(){
  const L=levelData();
  const positions=L.cells.map(c=>cellScreen(c.x,c.y));
  // distant towers
  ctx.fillStyle="#0d0d0d";
  for(let i=0;i<7;i++){
    const x=(i/7)*W+30;
    const h=120+(i%3)*90;
    ctx.fillRect(x,H*.35-h,75,h);
  }

  // connections first: visually continuous bridges
  const seen=reachable();
  for(const c of L.cells){
    const p=cellScreen(c.x,c.y),a=connections(c);
    ctx.save();ctx.translate(p.x,p.y);
    ctx.strokeStyle=seen.has(key(c.x,c.y))?"#cfcfcf":"#555";
    ctx.lineWidth=Math.max(12,p.cw*.13);
    ctx.lineCap="square";
    const len=Math.min(p.cw,p.ch)*.34;
    if(a[0]){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-len);ctx.stroke()}
    if(a[1]){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(len,0);ctx.stroke()}
    if(a[2]){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,len);ctx.stroke()}
    if(a[3]){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-len,0);ctx.stroke()}
    ctx.restore();
  }

  // tiles
  for(const c of L.cells){
    const p=cellScreen(c.x,c.y),a=connections(c);
    const reachableCell=seen.has(key(c.x,c.y));
    const hinted=c._hintUntil&&c._hintUntil>performance.now();
    ctx.save();ctx.translate(p.x,p.y);
    ctx.shadowColor=reachableCell?"#fff6":"#000";
    ctx.shadowBlur=reachableCell?14:8;

    const grad=ctx.createLinearGradient(0,-p.ch*.25,0,p.ch*.25);
    grad.addColorStop(0,reachableCell?"#f2f2f2":"#a0a0a0");
    grad.addColorStop(.45,reachableCell?"#a8a8a8":"#666");
    grad.addColorStop(1,"#292929");
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.moveTo(-p.cw*.34,-p.ch*.27);
    ctx.lineTo(p.cw*.34,-p.ch*.27);
    ctx.lineTo(p.cw*.45,p.ch*.27);
    ctx.lineTo(-p.cw*.45,p.ch*.27);
    ctx.closePath();ctx.fill();
    ctx.shadowBlur=0;

    ctx.strokeStyle=hinted?"#fff":reachableCell?"#ddd":"#555";
    ctx.lineWidth=hinted?4:2;
    ctx.stroke();

    // center mechanism
    ctx.fillStyle=reachableCell?"#eee":"#555";
    ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.fill();

    if(isFixed(c)){
      ctx.fillStyle="#555";ctx.font="10px Segoe UI";ctx.textAlign="center";ctx.fillText("LOCKED",0,p.ch*.42);
    }else{
      ctx.fillStyle="#777";ctx.font="9px Segoe UI";ctx.textAlign="center";ctx.fillText("ROTATE",0,p.ch*.42);
    }
    ctx.restore();
  }

  // door
  const g=cellScreen(...L.goal);
  const glow=ctx.createRadialGradient(g.x,g.y,5,g.x,g.y,55);
  glow.addColorStop(0,"rgba(255,255,255,.35)");
  glow.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(g.x,g.y,55,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#fff";ctx.lineWidth=4;
  ctx.strokeRect(g.x-24,g.y-34,48,68);
  ctx.fillStyle="#111";ctx.fillRect(g.x-15,g.y-27,30,61);
  ctx.fillStyle="#ddd";ctx.font="bold 10px Segoe UI";ctx.textAlign="center";ctx.fillText("DOOR",g.x,g.y+52);
}

function drawPlayer(){
  const p=cellScreen(player.px,player.py);
  ctx.save();ctx.translate(p.x,p.y-18);
  ctx.fillStyle="#0008";ctx.beginPath();ctx.ellipse(0,25,17,6,0,0,Math.PI*2);ctx.fill();
  const grad=ctx.createLinearGradient(-14,-22,14,22);
  grad.addColorStop(0,"#fff");grad.addColorStop(.55,"#bbb");grad.addColorStop(1,"#555");
  ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#171717";ctx.beginPath();ctx.arc(0,-4,8,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();
  ctx.restore();
}

function drawParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.life<=0){particles.splice(i,1);continue}
    ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle="#fff";ctx.fillRect(p.x,p.y,3,3);
  }
  ctx.globalAlpha=1;
}

function draw(){
  drawBackground();
  drawArchitecture();
  drawPlayer();
}

let last=performance.now();
function loop(t){
  const dt=Math.min(.033,(t-last)/1000);last=t;
  draw();
  drawParticles(dt);
  pulse*=.94;
  requestAnimationFrame(loop);
}

function canvasPoint(e){
  const r=canvas.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}
canvas.addEventListener("click",e=>{
  if(animating||ui.message.style.display==="flex")return;
  const m=canvasPoint(e),L=levelData();
  let best=null,bestD=Infinity;
  for(const c of L.cells){
    if(isFixed(c))continue;
    const p=cellScreen(c.x,c.y),d=Math.hypot(m.x-p.x,m.y-p.y);
    if(d<Math.min(p.cw,p.ch)*.48&&d<bestD){best=c;bestD=d}
  }
  if(best)saveAndRotate(best);
});

addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(k==="escape"){exitGame();return}
  if(k==="u"){undo();return}
  if(k==="r"){
    const L=levelData();
    const candidates=L.cells.filter(c=>!isFixed(c));
    if(candidates.length){
      const c=candidates[Math.floor(Math.random()*candidates.length)];
      saveAndRotate(c);
    }
  }
});

function exitGame(){window.history.back()}
document.getElementById("exit").onclick=exitGame;
document.getElementById("msgExit").onclick=exitGame;
document.getElementById("again").onclick=()=>{levelIndex=0;loadLevel();ui.message.style.display="none"};
document.getElementById("undo").onclick=undo;
document.getElementById("reset").onclick=reset;
document.getElementById("hintBtn").onclick=showHint;

loadLevel();
requestAnimationFrame(loop);
</script>
</body>
</html>
