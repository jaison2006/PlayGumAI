<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PlayGumAI — Hollow Knight Demo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07080c;color:#edf0f4;font-family:Inter,Segoe UI,Arial,sans-serif}
body{user-select:none}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:rgba(7,9,14,.84);border:1px solid rgba(225,230,240,.20);box-shadow:0 14px 50px #000b,inset 0 1px #fff1;backdrop-filter:blur(9px)}
#mission{position:absolute;left:18px;top:18px;padding:14px 17px;border-radius:13px;min-width:310px}
.kicker{font-size:10px;letter-spacing:3px;color:#9fa8b4}
#title{font-size:21px;font-weight:900;letter-spacing:1px;margin-top:5px}
#objective{font-size:13px;color:#c1c7ce;margin-top:5px;line-height:1.4}
#stats{font-size:11px;color:#8d96a1;margin-top:9px}
#exit{position:absolute;right:18px;top:18px;pointer-events:auto;cursor:pointer;border:1px solid #fff;background:linear-gradient(#fff,#b9c0c6);color:#050609;font-weight:900;padding:10px 18px;border-radius:9px;box-shadow:0 5px 20px #000b}
#exit:hover{filter:brightness(1.1);transform:translateY(-1px)}
#help{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:9px 14px;border-radius:10px;color:#a5adb6;font-size:11px;white-space:nowrap}
#soul{position:absolute;right:18px;bottom:18px;width:220px;padding:11px 13px;border-radius:11px}
.label{font-size:9px;letter-spacing:2px;color:#969faa;margin-bottom:6px}
.bar{height:7px;background:#171a20;border-radius:8px;overflow:hidden;margin-bottom:8px}
.fill{height:100%;width:100%}
#health{background:linear-gradient(90deg,#dfe5ea,#8f9aa5)}
#focus{background:linear-gradient(90deg,#fff,#8795a4)}
#message{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000d;pointer-events:auto}
#modal{width:min(530px,calc(100vw - 34px));padding:36px;border-radius:18px;text-align:center}
#modal h1{margin:0 0 10px;font-size:36px;letter-spacing:3px}
#modal p{margin:0;color:#aeb6bf;line-height:1.55}
.btn{margin-top:20px;padding:11px 19px;border-radius:9px;font-weight:800;cursor:pointer}
#restart{background:#11141a;color:#fff;border:1px solid #666}
#modalExit{margin-left:8px;background:linear-gradient(#fff,#b8c0c7);color:#050609;border:1px solid #fff}
@media(max-width:650px){
#mission{left:10px;top:10px;width:calc(100% - 20px);min-width:0}
#exit{top:110px;right:10px}
#help{max-width:92vw;white-space:normal;text-align:center;bottom:105px}
#soul{left:50%;right:auto;transform:translateX(-50%);bottom:14px;width:min(300px,82vw)}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
<div id="mission" class="panel">
  <div class="kicker">PLAYGUMAI // THE PALE UNDERCITY</div>
  <div id="title">VEILBOUND</div>
  <div id="objective">Explore the forgotten halls and recover 5 pale seals.</div>
  <div id="stats">Seals: <span id="seals">0/5</span> · Echoes: <span id="echoes">0</span> · Score: <span id="score">0</span></div>
</div>

<button id="exit">EXIT GAME</button>

<div id="help" class="panel">
  A/D or ←/→: MOVE · W/↑/SPACE: JUMP · J: NAIL STRIKE · K: FOCUS
</div>

<div id="soul" class="panel">
  <div class="label">MASK VITALITY</div>
  <div class="bar"><div id="health" class="fill"></div></div>
  <div class="label">FOCUS</div>
  <div class="bar"><div id="focus" class="fill"></div></div>
</div>

<div id="message">
 <div id="modal" class="panel">
  <h1 id="msgTitle">THE VEIL OPENS</h1>
  <p id="msgText"></p>
  <button id="restart" class="btn">RESTART</button>
  <button id="modalExit" class="btn">EXIT GAME</button>
 </div>
</div>
</div>

<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,dpr=1;
function resize(){
 W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=W*dpr;canvas.height=H*dpr;
 canvas.style.width=W+"px";canvas.style.height=H+"px";
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);resize();

const keys={};
addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(["arrowleft","arrowright","arrowup","arrowdown"," "].includes(e.key.toLowerCase()))e.preventDefault();
 if(e.key.toLowerCase()==="escape")exitGame();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

let player,platforms,seals,enemies,particles,walls,score,echoes,won,lost,last,attackClock;

function reset(){
 player={x:W*.12,y:H*.68,w:28,h:42,vx:0,vy:0,hp:100,focus:0,onGround:false,inv:0,attack:0};
 platforms=[
  {x:0,y:H-42,w:W,h:42},
  {x:W*.04,y:H*.72,w:W*.24,h:17},
  {x:W*.34,y:H*.59,w:W*.22,h:17},
  {x:W*.65,y:H*.72,w:W*.25,h:17},
  {x:W*.16,y:H*.43,w:W*.22,h:17},
  {x:W*.48,y:H*.30,w:W*.24,h:17},
  {x:W*.78,y:H*.47,w:W*.18,h:17}
 ];
 walls=[
  {x:W*.28,y:H*.34,w:20,h:H*.38},
  {x:W*.59,y:H*.42,w:20,h:H*.31},
  {x:W*.74,y:H*.18,w:20,h:H*.30}
 ];
 const points=[
  [.15,.64],[.43,.51],[.75,.64],[.26,.37],[.59,.24]
 ];
 seals=points.map((p,i)=>({x:W*p[0],y:H*p[1],r:13,taken:false,phase:i}));
 enemies=[
  {x:W*.43,y:H*.53,r:18,vx:45,vy:0,hp:3,stun:0},
  {x:W*.70,y:H*.66,r:18,vx:-50,vy:0,hp:3,stun:0},
  {x:W*.83,y:H*.40,r:17,vx:38,vy:0,hp:2,stun:0},
  {x:W*.52,y:H*.24,r:17,vx:-42,vy:0,hp:2,stun:0}
 ];
 particles=[];score=0;echoes=0;won=false;lost=false;attackClock=0;
 document.getElementById("message").style.display="none";
 updateHUD();
}

function burst(x,y,n=12){
 for(let i=0;i<n;i++){
  const a=Math.random()*Math.PI*2,s=30+Math.random()*150;
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.65});
 }
}

function attack(){
 const now=performance.now();
 if(now-attackClock<280||won||lost)return;
 attackClock=now;
 player.attack=.18;
 enemies.forEach(e=>{
  if(e.hp<=0)return;
  const dx=e.x-(player.x+player.w/2),dy=e.y-(player.y+player.h/2);
  const d=Math.hypot(dx,dy);
  const facing=player.vx>=0?dx>0:dx<0;
  if(d<90 && (facing||Math.abs(player.vx)<5)){
   e.hp--;e.stun=.22;score+=100;echoes++;player.focus=Math.min(100,player.focus+12);
   burst(e.x,e.y,10);
  }
 });
}

function focus(){
 if(player.focus<30||won||lost)return;
 player.focus-=30;
 player.hp=Math.min(100,player.hp+24);
 burst(player.x+player.w/2,player.y+player.h/2,22);
}

function jump(){
 if(player.onGround){player.vy=-520;player.onGround=false}
}

function update(dt){
 if(won||lost)return;

 let dir=0;
 if(keys.a||keys.arrowleft)dir--;
 if(keys.d||keys.arrowright)dir++;
 player.vx=dir*240;
 player.vy+=1300*dt;
 player.x+=player.vx*dt;
 player.y+=player.vy*dt;

 if((keys.w||keys.arrowup||keys[" "])&&player.onGround){
  jump();keys.w=false;keys.arrowup=false;keys[" "]=false;
 }
 if(keys.j){attack();keys.j=false}
 if(keys.k){focus();keys.k=false}

 player.x=Math.max(0,Math.min(W-player.w,player.x));
 player.onGround=false;

 platforms.forEach(p=>{
  if(player.x+player.w>p.x&&player.x<p.x+p.w&&
     player.y+player.h>=p.y&&player.y+player.h<=p.y+24&&player.vy>=0){
   player.y=p.y-player.h;player.vy=0;player.onGround=true;
  }
 });

 seals.forEach(s=>{
  if(!s.taken&&Math.hypot(player.x+player.w/2-s.x,player.y+player.h/2-s.y)<34){
   s.taken=true;score+=250;player.focus=Math.min(100,player.focus+20);burst(s.x,s.y,28);
  }
 });

 enemies.forEach(e=>{
  if(e.hp<=0)return;
  e.stun=Math.max(0,e.stun-dt);
  if(!e.stun){
   e.x+=e.vx*dt;
   if(e.x<25||e.x>W-40)e.vx*=-1;
  }
  e.vy+=1000*dt;e.y+=e.vy*dt;
  e.ground=false;
  platforms.forEach(p=>{
   if(e.x+e.r>p.x&&e.x-e.r<p.x+p.w&&e.y+e.r>=p.y&&e.y+e.r<=p.y+22&&e.vy>=0){
    e.y=p.y-e.r;e.vy=0;e.ground=true;
   }
  });
  const d=Math.hypot(player.x+player.w/2-e.x,player.y+player.h/2-e.y);
  if(d<38&&!player.inv){
   player.hp-=28*dt;player.inv=.15;
  }
 });
 enemies=enemies.filter(e=>e.hp>0);

 player.inv=Math.max(0,player.inv-dt);
 player.focus=Math.min(100,player.focus+3*dt);
 player.attack=Math.max(0,player.attack-dt);

 if(seals.every(s=>s.taken)){
  document.getElementById("objective").textContent="The pale seals resonate. Reach the ancient gate.";
  const gate={x:W*.92,y:H*.32};
  if(Math.hypot(player.x+player.w/2-gate.x,player.y+player.h/2-gate.y)<65){
   won=true;score+=1200;showResult(true);
  }
 }
 if(player.hp<=0||player.y>H+120){lost=true;showResult(false)}

 particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});
 particles=particles.filter(p=>p.life>0);
 updateHUD();
}

function updateHUD(){
 document.getElementById("seals").textContent=seals.filter(s=>s.taken).length+"/5";
 document.getElementById("echoes").textContent=echoes;
 document.getElementById("score").textContent=score;
 document.getElementById("health").style.width=Math.max(0,player.hp)+"%";
 document.getElementById("focus").style.width=Math.max(0,player.focus)+"%";
}

function showResult(success){
 document.getElementById("msgTitle").textContent=success?"THE VEIL OPENS":"THE KINGDOM FALLS";
 document.getElementById("msgText").textContent=success
 ?"All five pale seals are restored. The ancient gate opens into the forgotten kingdom. Score: "+score+"."
 :"Your mask could not withstand the depths. Score: "+score+".";
 document.getElementById("message").style.display="flex";
}

function draw(){
 ctx.clearRect(0,0,W,H);

 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#11151b");g.addColorStop(.55,"#080b10");g.addColorStop(1,"#020305");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 // distant cavern layers
 for(let layer=0;layer<6;layer++){
  ctx.fillStyle="rgba(35,42,50,"+(0.16-layer*.018)+")";
  ctx.beginPath();
  ctx.moveTo(0,H*.45+layer*45);
  for(let x=0;x<=W;x+=80){
   ctx.lineTo(x,H*.40+layer*45+Math.sin(x*.009+layer)*35);
  }
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
 }

 // hanging ruins
 ctx.strokeStyle="rgba(200,210,220,.12)";
 ctx.lineWidth=2;
 for(let i=0;i<16;i++){
  const x=(i*137)%W;
  const len=35+(i%5)*18;
  ctx.beginPath();ctx.moveTo(x,80);ctx.lineTo(x+((i%3)-1)*20,80+len);ctx.stroke();
 }

 // walls
 walls.forEach(w=>{
  ctx.fillStyle="#11161b";ctx.fillRect(w.x,w.y,w.w,w.h);
  ctx.strokeStyle="rgba(220,230,240,.13)";ctx.strokeRect(w.x,w.y,w.w,w.h);
 });

 // platforms
 platforms.forEach(p=>{
  ctx.fillStyle="#0c1116";ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.strokeStyle="#aeb8c2";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+p.w,p.y);ctx.stroke();
  ctx.strokeStyle="rgba(255,255,255,.07)";
  ctx.beginPath();ctx.moveTo(p.x,p.y+p.h);ctx.lineTo(p.x+p.w,p.y+p.h);ctx.stroke();
 });

 // gate
 const ready=seals.every(s=>s.taken);
 const gx=W*.92,gy=H*.32;
 ctx.shadowBlur=ready?24:8;ctx.shadowColor="#dfe6ed";
 ctx.strokeStyle=ready?"#eef2f5":"#4b555e";ctx.lineWidth=4;
 ctx.beginPath();ctx.arc(gx,gy,31+Math.sin(performance.now()/220)*3,Math.PI,0);ctx.stroke();
 ctx.shadowBlur=0;
 ctx.fillStyle="#aeb7c0";ctx.font="10px Arial";ctx.textAlign="center";
 ctx.fillText(ready?"ANCIENT GATE":"SEALED",gx,gy+50);ctx.textAlign="left";

 // seals
 seals.forEach(s=>{
  if(s.taken)return;
  const pulse=3+Math.sin(performance.now()/250+s.phase)*3;
  ctx.save();ctx.translate(s.x,s.y);
  ctx.shadowBlur=18;ctx.shadowColor="#dce6ef";
  ctx.fillStyle="#dfe7ed";ctx.strokeStyle="#fff";ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,0,s.r+pulse,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,-s.r);ctx.lineTo(s.r*.65,0);ctx.lineTo(0,s.r);ctx.lineTo(-s.r*.65,0);ctx.closePath();ctx.fill();
  ctx.restore();ctx.shadowBlur=0;
 });

 // enemies
 enemies.forEach(e=>{
  ctx.save();ctx.translate(e.x,e.y);
  ctx.fillStyle="#080b0e";ctx.strokeStyle=e.stun?"#fff":"#9ca7b1";ctx.lineWidth=2;
  ctx.shadowBlur=12;ctx.shadowColor="#dce5ec";
  ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.shadowBlur=0;
  ctx.fillStyle="#e8edf1";ctx.fillRect(-8,-3,5,6);ctx.fillRect(3,-3,5,6);
  ctx.restore();
 });

 // particles
 particles.forEach(p=>{
  ctx.globalAlpha=Math.max(0,p.life);
  ctx.fillStyle="#dce5ec";ctx.fillRect(p.x,p.y,3,3);
 });
 ctx.globalAlpha=1;

 // attack arc
 if(player.attack>0){
  ctx.save();
  ctx.translate(player.x+player.w/2,player.y+player.h/2);
  ctx.scale(player.vx>=0?1:-1,1);
  ctx.globalAlpha=player.attack/.18;
  ctx.strokeStyle="#fff";ctx.lineWidth=5;ctx.shadowBlur=20;ctx.shadowColor="#fff";
  ctx.beginPath();ctx.arc(0,0,70,-.9,.9);ctx.stroke();
  ctx.restore();
  ctx.globalAlpha=1;
 }

 // player
 ctx.save();ctx.translate(player.x+player.w/2,player.y+player.h/2);
 ctx.globalAlpha=player.inv>.0?.45:1;
 ctx.shadowBlur=22;ctx.shadowColor="#eef3f7";
 ctx.fillStyle="#edf1f4";
 ctx.beginPath();ctx.arc(0,0,17,0,Math.PI*2);ctx.fill();
 ctx.shadowBlur=0;
 ctx.fillStyle="#0b0e12";
 ctx.beginPath();ctx.moveTo(-13,-2);ctx.lineTo(-7,15);ctx.lineTo(7,15);ctx.lineTo(13,-2);ctx.closePath();ctx.fill();
 ctx.strokeStyle="#fff";ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(-8,-6);ctx.lineTo(-3,-12);ctx.lineTo(0,-6);
 ctx.moveTo(8,-6);ctx.lineTo(3,-12);ctx.lineTo(0,-6);ctx.stroke();
 ctx.restore();ctx.globalAlpha=1;
}

function loop(t){
 const dt=Math.min(.033,(t-last)/1000);last=t;
 update(dt);draw();requestAnimationFrame(loop);
}

function exitGame(){
 if(history.length>1)history.back();
 else location.href="/";
}
document.getElementById("exit").onclick=exitGame;
document.getElementById("modalExit").onclick=exitGame;
document.getElementById("restart").onclick=reset;

reset();last=performance.now();requestAnimationFrame(loop);
</script>
</body>
</html>
