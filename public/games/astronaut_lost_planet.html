<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlayGumAI — Astronaut: Lost Planet</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050a;color:#eaf7ff;font-family:Inter,Segoe UI,Arial,sans-serif}
canvas{display:block;width:100vw;height:100vh}
#ui{position:fixed;inset:0;pointer-events:none}
.panel{background:rgba(4,11,18,.86);border:1px solid rgba(150,220,255,.22);box-shadow:0 12px 40px #000b,inset 0 1px #fff1;backdrop-filter:blur(8px)}
#mission{position:absolute;left:18px;top:18px;padding:14px 16px;border-radius:13px;min-width:315px}
.kicker{font-size:9px;letter-spacing:3px;color:#72d9ff}
#title{font-size:21px;font-weight:900;margin:5px 0}
#objective{font-size:13px;color:#b8ccd8;line-height:1.45}
#stats{font-size:11px;color:#829cab;margin-top:8px}
#exit{position:absolute;right:18px;top:18px;pointer-events:auto;cursor:pointer;padding:10px 18px;border-radius:9px;border:1px solid #fff;background:linear-gradient(#fff,#b8c8d1);color:#071019;font-weight:900}
#exit:hover{filter:brightness(1.1);transform:translateY(-1px)}
#controls{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:9px 14px;border-radius:9px;color:#a8c0cc;font-size:11px;white-space:nowrap}
#status{position:absolute;right:18px;bottom:18px;width:235px;padding:11px;border-radius:10px}
.label{font-size:9px;letter-spacing:2px;color:#82b4c8}
.bar{height:7px;background:#10202a;border-radius:8px;overflow:hidden;margin:5px 0 9px}
.fill{height:100%}
#oxygen{background:linear-gradient(90deg,#49d8ff,#d9fbff)}
#suit{background:linear-gradient(90deg,#7c91ff,#cfd6ff)}
#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#01050acc;pointer-events:auto}
#modal{width:min(520px,90vw);padding:34px;border-radius:18px;text-align:center}
#modal h1{margin:0 0 10px;font-size:34px;letter-spacing:2px}
#modal p{color:#b9cdd7;line-height:1.55}
.action{margin-top:13px;padding:10px 19px;border-radius:9px;font-weight:900;cursor:pointer}
#restart{background:#0d1a23;color:#eefaff;border:1px solid #587485}
#back{margin-left:8px;background:linear-gradient(#fff,#b8c8d1);border:1px solid #fff;color:#071019}
@media(max-width:650px){
#mission{left:9px;top:9px;width:calc(100% - 18px);min-width:0}
#exit{top:108px;right:9px}
#controls{width:94%;white-space:normal;text-align:center;bottom:105px}
#status{left:50%;right:auto;transform:translateX(-50%);bottom:12px;width:80%}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">
<div id="mission" class="panel">
 <div class="kicker">PLAYGUMAI // LOST PLANET</div>
 <div id="title">ASTRONAUT: LOST PLANET</div>
 <div id="objective">Recover 4 distress beacons and reach the abandoned escape pod.</div>
 <div id="stats">Beacons: <span id="beacons">0/4</span> · Crystals: <span id="crystals">0</span> · Score: <span id="score">0</span></div>
</div>

<button id="exit">EXIT GAME</button>

<div id="controls" class="panel">
 WASD / ARROWS MOVE · SPACE JUMP · E SCAN / REPAIR · SHIFT JET DASH
</div>

<div id="status" class="panel">
 <div class="label">OXYGEN</div><div class="bar"><div id="oxygen" class="fill"></div></div>
 <div class="label">SUIT POWER</div><div class="bar"><div id="suit" class="fill"></div></div>
</div>
</div>

<div id="overlay">
<div id="modal" class="panel">
 <h1 id="resultTitle"></h1>
 <p id="resultText"></p>
 <button id="restart" class="action">RESTART MISSION</button>
 <button id="back" class="action">EXIT GAME</button>
</div>
</div>

<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,dpr=1;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",resize);resize();

const keys={};
addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();keys[k]=true;
 if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();
 if(k==="escape")exitGame();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

let p,beacons,crystals,rocks,vents,particles,score,crystalCount,finished,won,dashCD,last=0;

function reset(){
 p={x:W*.5,y:H*.68,w:24,h:34,vx:0,vy:0,speed:175,oxygen:100,power:100,ground:false,dir:1,inv:0};
 beacons=[
  {x:W*.17,y:H*.37,on:false},
  {x:W*.39,y:H*.63,on:false},
  {x:W*.66,y:H*.31,on:false},
  {x:W*.84,y:H*.58,on:false}
 ];
 crystals=[
  {x:W*.25,y:H*.28,on:true},{x:W*.52,y:H*.45,on:true},
  {x:W*.76,y:H*.24,on:true},{x:W*.92,y:H*.36,on:true},
  {x:W*.59,y:H*.73,on:true}
 ];
 rocks=[
  {x:W*.1,y:H*.57,s:1.2},{x:W*.28,y:H*.74,s:.8},{x:W*.48,y:H*.28,s:1},
  {x:W*.72,y:H*.68,s:1.1},{x:W*.9,y:H*.73,s:.9}
 ];
 vents=[
  {x:W*.31,y:H*.49},{x:W*.56,y:H*.64},{x:W*.78,y:H*.48}
 ];
 particles=[];score=0;crystalCount=0;finished=false;won=false;dashCD=0;
 document.getElementById("overlay").style.display="none";updateUI();
}

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function burst(x,y,n=14){
 for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=30+Math.random()*130;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4+Math.random()*.7})}
}
function nearestBeacon(){
 return beacons.find(b=>!b.on&&dist(p,b)<52);
}
function interact(){
 const b=nearestBeacon();
 if(b){b.on=true;score+=350;p.power=Math.min(100,p.power+20);burst(b.x,b.y,30);return}
 for(const c of crystals)if(c.on&&dist(p,c)<35){c.on=false;crystalCount++;score+=100;p.oxygen=Math.min(100,p.oxygen+8);burst(c.x,c.y,16);return}
}
function dash(){
 if(dashCD>0||p.power<20||finished)return;
 dashCD=.7;p.power-=20;p.inv=.25;p.vx=p.dir*570;p.vy=-100;burst(p.x,p.y,22);
}
function update(dt){
 if(finished)return;
 dashCD=Math.max(0,dashCD-dt);p.inv=Math.max(0,p.inv-dt);

 let dx=0,dy=0;
 if(keys.a||keys.arrowleft)dx--;if(keys.d||keys.arrowright)dx++;
 if(keys.w||keys.arrowup)dy--;if(keys.s||keys.arrowdown)dy++;
 if(dx||dy){
  const l=Math.hypot(dx,dy);dx/=l;dy/=l;p.dir=dx<0?-1:dx>0?1:p.dir;
  p.vx+=dx*700*dt;p.vy+=dy*450*dt;
 }
 if((keys[" "]||keys.w||keys.arrowup)&&p.ground){p.vy=-440;p.ground=false;keys[" "]=keys.w=keys.arrowup=false}
 if(keys.e){interact();keys.e=false}
 if(keys.shift){dash();keys.shift=false}

 p.vy+=1050*dt;p.vx*=Math.pow(.006,dt);p.vx=Math.max(-260,Math.min(260,p.vx));
 p.x+=p.vx*dt;p.y+=p.vy*dt;
 p.x=Math.max(30,Math.min(W-30,p.x));p.y=Math.max(120,Math.min(H-60,p.y));
 p.ground=false;

 // crater platforms
 const floor=H*.79;
 if(p.y+p.h>=floor&&p.vy>=0){p.y=floor-p.h;p.vy=0;p.ground=true}
 const ledges=[
  {x:W*.05,y:H*.62,w:230},{x:W*.31,y:H*.72,w:190},
  {x:W*.55,y:H*.57,w:210},{x:W*.76,y:H*.69,w:230},
  {x:W*.17,y:H*.45,w:170},{x:W*.65,y:H*.38,w:170}
 ];
 ledges.forEach(q=>{
  if(p.x+p.w>q.x&&p.x<q.x+q.w&&p.y+p.h>=q.y&&p.y+p.h<=q.y+24&&p.vy>=0){p.y=q.y-p.h;p.vy=0;p.ground=true}
 });

 vents.forEach(v=>{if(dist(p,v)<48&&!p.inv){p.power-=25*dt;p.inv=.08;burst(p.x,p.y,2)}});

 p.oxygen-=1.5*dt;
 p.power=Math.min(100,p.power+5*dt);
 if(p.oxygen<=0){finished=true;show(false,"OXYGEN DEPLETED");}
 if(p.y>H+100){finished=true;show(false,"SUIT SIGNAL LOST");}

 if(beacons.every(b=>b.on)){
  document.getElementById("objective").textContent="All distress beacons online. Reach the escape pod.";
  const ex={x:W*.92,y:H*.19};
  if(dist(p,ex)<70){finished=true;won=true;score+=1800;show(true,"MISSION COMPLETE")}
 }
 particles.forEach(a=>{a.x+=a.vx*dt;a.y+=a.vy*dt;a.life-=dt});
 particles=particles.filter(a=>a.life>0);updateUI();
}
function updateUI(){
 document.getElementById("beacons").textContent=beacons.filter(b=>b.on).length+"/4";
 document.getElementById("crystals").textContent=crystalCount;
 document.getElementById("score").textContent=score;
 document.getElementById("oxygen").style.width=Math.max(0,p.oxygen)+"%";
 document.getElementById("suit").style.width=Math.max(0,p.power)+"%";
}
function show(success,title){
 document.getElementById("resultTitle").textContent=title;
 document.getElementById("resultText").textContent=success
 ?"The escape pod has received your signal. You survived the lost planet. Final score: "+score+"."
 :"The planet swallowed the last signal from your suit. Final score: "+score+".";
 document.getElementById("overlay").style.display="flex";
}

function draw(){
 ctx.clearRect(0,0,W,H);
 const sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,"#07121f");sky.addColorStop(.5,"#172d3b");sky.addColorStop(1,"#07090c");
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

 // alien planet sky
 ctx.shadowBlur=40;ctx.shadowColor="#6bdcff";ctx.fillStyle="#9deaff";ctx.beginPath();ctx.arc(W*.78,H*.17,48,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
 ctx.fillStyle="rgba(95,220,255,.08)";ctx.beginPath();ctx.arc(W*.78,H*.17,75,0,Math.PI*2);ctx.fill();

 // distant alien mountains
 ctx.fillStyle="#0a1c25";ctx.beginPath();ctx.moveTo(0,H*.54);ctx.lineTo(W*.13,H*.28);ctx.lineTo(W*.26,H*.51);ctx.lineTo(W*.43,H*.22);ctx.lineTo(W*.6,H*.5);ctx.lineTo(W*.76,H*.27);ctx.lineTo(W,H*.48);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();

 // terrain
 ctx.fillStyle="#182d27";ctx.beginPath();ctx.ellipse(W*.5,H*.68,W*.48,H*.34,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#263d31";ctx.beginPath();ctx.ellipse(W*.5,H*.66,W*.42,H*.28,0,0,Math.PI*2);ctx.fill();

 // ledges
 const ledges=[
  {x:W*.05,y:H*.62,w:230},{x:W*.31,y:H*.72,w:190},
  {x:W*.55,y:H*.57,w:210},{x:W*.76,y:H*.69,w:230},
  {x:W*.17,y:H*.45,w:170},{x:W*.65,y:H*.38,w:170}
 ];
 ledges.forEach(q=>{ctx.fillStyle="#1a2925";ctx.fillRect(q.x,q.y,q.w,16);ctx.strokeStyle="#4c8177";ctx.strokeRect(q.x,q.y,q.w,16)});

 // rocks
 rocks.forEach(r=>{
  ctx.save();ctx.translate(r.x,r.y);ctx.scale(r.s,r.s);
  ctx.fillStyle="#263f42";ctx.beginPath();ctx.moveTo(-25,12);ctx.lineTo(-15,-18);ctx.lineTo(10,-27);ctx.lineTo(28,8);ctx.lineTo(12,20);ctx.closePath();ctx.fill();
  ctx.fillStyle="#40686a";ctx.beginPath();ctx.moveTo(-10,-16);ctx.lineTo(8,-22);ctx.lineTo(17,-7);ctx.lineTo(-4,-5);ctx.closePath();ctx.fill();ctx.restore();
 });

 // vents
 vents.forEach(v=>{
  ctx.strokeStyle="#62d8dc";ctx.lineWidth=3;ctx.beginPath();ctx.arc(v.x,v.y,17+Math.sin(performance.now()/160)*3,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle="rgba(70,220,230,.18)";ctx.beginPath();ctx.arc(v.x,v.y,27,0,Math.PI*2);ctx.fill();
 });

 // beacons
 beacons.forEach((b,i)=>{
  ctx.save();ctx.translate(b.x,b.y);
  ctx.strokeStyle=b.on?"#baf8ff":"#45616a";ctx.lineWidth=4;
  ctx.shadowBlur=b.on?22:4;ctx.shadowColor="#67e8ff";
  ctx.beginPath();ctx.arc(0,0,25+Math.sin(performance.now()/200+i)*2,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle=b.on?"#dffcff":"#2d4047";ctx.fillRect(-6,-18,12,36);
  ctx.fillStyle="#dffcff";ctx.fillRect(-3,-12,6,24);
  ctx.shadowBlur=0;ctx.restore();
 });

 // crystals
 crystals.forEach(c=>{
  if(!c.on)return;
  ctx.save();ctx.translate(c.x,c.y);ctx.rotate(.2);
  ctx.shadowBlur=20;ctx.shadowColor="#6cf6ff";ctx.fillStyle="#c8ffff";
  ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(9,0);ctx.lineTo(0,15);ctx.lineTo(-9,0);ctx.closePath();ctx.fill();
  ctx.restore();ctx.shadowBlur=0;
 });

 // escape pod
 const ex={x:W*.92,y:H*.19};
 ctx.fillStyle="#4e5d65";ctx.beginPath();ctx.ellipse(ex.x,ex.y,32,17,-.2,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle=beacons.every(b=>b.on)?"#aef9ff":"#44545b";ctx.lineWidth=3;ctx.stroke();
 ctx.fillStyle="#dffcff";ctx.font="10px Arial";ctx.textAlign="center";ctx.fillText(beacons.every(b=>b.on)?"ESCAPE POD":"LOCKED",ex.x,ex.y+34);ctx.textAlign="left";

 // particles
 particles.forEach(a=>{ctx.globalAlpha=Math.max(0,a.life);ctx.fillStyle="#9deaff";ctx.fillRect(a.x,a.y,3,3)});ctx.globalAlpha=1;

 // astronaut
 ctx.save();ctx.translate(p.x,p.y);ctx.scale(p.dir,1);
 ctx.globalAlpha=p.inv?.5:1;
 ctx.fillStyle="#e9f5f7";ctx.beginPath();ctx.arc(0,-10,11,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#b7d6dd";ctx.fillRect(-11,0,22,24);
 ctx.fillStyle="#1b3340";ctx.fillRect(-8,-14,16,8);
 ctx.fillStyle="#75e7ff";ctx.fillRect(-5,-12,10,4);
 ctx.fillStyle="#d8eef1";ctx.fillRect(-14,20,10,7);ctx.fillRect(4,20,10,7);
 ctx.strokeStyle="#76e7ff";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(10,5);ctx.lineTo(25,8);ctx.stroke();
 ctx.restore();ctx.globalAlpha=1;

 // beacon proximity prompt
 const nb=nearestBeacon();
 if(nb){ctx.fillStyle="rgba(2,8,12,.82)";ctx.fillRect(nb.x-55,nb.y-55,110,24);ctx.fillStyle="#eaffff";ctx.font="bold 10px Arial";ctx.textAlign="center";ctx.fillText("E  REPAIR BEACON",nb.x,nb.y-39);ctx.textAlign="left"}
}

function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
function exitGame(){if(history.length>1)history.back();else location.href="/"}
document.getElementById("exit").onclick=exitGame;
document.getElementById("back").onclick=exitGame;
document.getElementById("restart").onclick=reset;
reset();last=performance.now();requestAnimationFrame(loop);
</script>
</body>
</html>
